<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%" style="background: #060913; font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <!-- 4 Isometric Glass Layers -->
    <linearGradient id="layer-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.5)" />
      <stop offset="100%" stop-color="rgba(255, 0, 127, 0.25)" />
    </linearGradient>

    <linearGradient id="layer-server" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.45)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.2)" />
    </linearGradient>

    <linearGradient id="layer-engine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.45)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.2)" />
    </linearGradient>

    <linearGradient id="layer-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.45)" />
      <stop offset="100%" stop-color="rgba(225, 29, 72, 0.2)" />
    </linearGradient>

    <!-- Pulse Data Streams -->
    <linearGradient id="pulse-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pulse-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    @keyframes floatL4 {
      0%, 100% { transform: translateY(-240px); }
      50% { transform: translateY(-252px); }
    }
    @keyframes floatL3 {
      0%, 100% { transform: translateY(-160px); }
      50% { transform: translateY(-170px); }
    }
    @keyframes floatL2 {
      0%, 100% { transform: translateY(-80px); }
      50% { transform: translateY(-88px); }
    }
    @keyframes floatL1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pulseDash {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes nodeBeacon {
      0%, 100% { r: 5; opacity: 0.6; }
      50% { r: 8; opacity: 1; filter: drop-shadow(0 0 10px #00f2fe); }
    }

    .layer-4 { animation: floatL4 5s ease-in-out infinite; }
    .layer-3 { animation: floatL3 5s ease-in-out infinite 0.7s; }
    .layer-2 { animation: floatL2 5s ease-in-out infinite 1.4s; }
    .layer-1 { animation: floatL1 5s ease-in-out infinite 2.1s; }

    .data-pipe-1 {
      stroke: url(#pulse-grad-1);
      stroke-width: 2.5;
      stroke-dasharray: 12, 8;
      animation: pulseDash 2.5s linear infinite;
    }

    .data-pipe-2 {
      stroke: url(#pulse-grad-2);
      stroke-width: 2.5;
      stroke-dasharray: 12, 8;
      animation: pulseDash 2.8s linear infinite;
    }

    .beacon { animation: nodeBeacon 2.2s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="960" height="720" fill="url(#bg-glow)" />

  <!-- Isometric Background Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,80 L 960,80 M 0,160 L 960,160 M 0,240 L 960,240 M 0,320 L 960,320 M 0,400 L 960,400 M 0,480 L 960,480 M 0,560 L 960,560 M 0,640 L 960,640" />
    <path d="M 120,0 L 120,720 M 240,0 L 240,720 M 360,0 L 360,720 M 480,0 L 480,720 M 600,0 L 600,720 M 720,0 L 720,720 M 840,0 L 840,720" />
  </g>

  <!-- Header Section -->
  <text x="480" y="44" fill="#ffffff" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="1.5">
    TIC-TAC-TOE PRO • 4-TIER 3D SYSTEM ARCHITECTURE
  </text>
  <text x="480" y="70" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">
    Cross-Platform • 2D Matrix Game Engine • Zero-Dependency Java HttpServer • Glassmorphic Web Dashboard
  </text>

  <!-- 3D ISOMETRIC 4-LAYER STACK -->
  <g transform="translate(480, 310)">

    <!-- ========================================================= -->
    <!-- LAYER 1: BASE RUNTIME & DESKTOP GUI LAYER -->
    <!-- ========================================================= -->
    <g class="layer-1" filter="url(#card-shadow)">
      <!-- Isometric Top Face -->
      <polygon points="0,150 -260,25 0,-100 260,25" fill="url(#layer-base)" stroke="#f59e0b" stroke-width="2" />
      <!-- Isometric Left Edge -->
      <polygon points="-260,25 0,150 0,165 -260,40" fill="rgba(245, 158, 11, 0.35)" stroke="#f59e0b" stroke-width="1" />
      <!-- Isometric Right Edge -->
      <polygon points="0,150 260,25 260,40 0,165" fill="rgba(225, 29, 72, 0.35)" stroke="#e11d48" stroke-width="1" />

      <!-- Nodes & Labels -->
      <circle cx="-130" cy="20" r="6" fill="#f59e0b" class="beacon" />
      <text x="-116" y="25" fill="#fef3c7" font-size="12" font-weight="700">JDK 21 HotSpot JVM</text>

      <circle cx="0" cy="-25" r="6" fill="#fbbf24" class="beacon" />
      <text x="14" y="-20" fill="#fef3c7" font-size="12" font-weight="700">Swing GUI (TicTacToeFrame)</text>

      <circle cx="120" cy="20" r="6" fill="#e11d48" class="beacon" />
      <text x="134" y="25" fill="#fef3c7" font-size="12" font-weight="700">FlatLaf Dark Theme Engine</text>

      <!-- Layer Badge -->
      <rect x="-210" y="80" width="165" height="24" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" />
      <text x="-127" y="96" fill="#f59e0b" font-size="10.5" font-weight="800" text-anchor="middle">TIER 1: RUNTIME &amp; DESKTOP</text>
    </g>

    <!-- DATA STREAM PIPES: LAYER 1 TO 2 -->
    <path d="M -130,20 L -130,-60" class="data-pipe-1" />
    <path d="M 0,-25 L 0,-105" class="data-pipe-2" />
    <path d="M 120,20 L 120,-60" class="data-pipe-1" />

    <!-- ========================================================= -->
    <!-- LAYER 2: MATRIX ENGINE & AI STRATEGY LAYER -->
    <!-- ========================================================= -->
    <g class="layer-2" filter="url(#card-shadow)">
      <polygon points="0,150 -260,25 0,-100 260,25" fill="url(#layer-engine)" stroke="#0ea5e9" stroke-width="2" />
      <polygon points="-260,25 0,150 0,165 -260,40" fill="rgba(14, 165, 233, 0.35)" stroke="#0ea5e9" stroke-width="1" />
      <polygon points="0,150 260,25 260,40 0,165" fill="rgba(16, 185, 129, 0.35)" stroke="#10b981" stroke-width="1" />

      <circle cx="-130" cy="20" r="6" fill="#0ea5e9" class="beacon" />
      <text x="-116" y="25" fill="#e0f2fe" font-size="12" font-weight="700">2D Matrix Board (char[3][3])</text>

      <circle cx="0" cy="-25" r="6" fill="#10b981" class="beacon" />
      <text x="14" y="-20" fill="#e0f2fe" font-size="12" font-weight="700">Loop Win &amp; Draw Scanners</text>

      <circle cx="120" cy="20" r="6" fill="#38bdf8" class="beacon" />
      <text x="134" y="25" fill="#e0f2fe" font-size="12" font-weight="700">Minimax Unbeatable AI</text>

      <rect x="-210" y="80" width="165" height="24" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.8" />
      <text x="-127" y="96" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle">TIER 2: MATRIX GAME ENGINE</text>
    </g>

    <!-- DATA STREAM PIPES: LAYER 2 TO 3 -->
    <path d="M -130,-60 L -130,-140" class="data-pipe-2" />
    <path d="M 0,-105 L 0,-185" class="data-pipe-1" />
    <path d="M 120,-60 L 120,-140" class="data-pipe-2" />

    <!-- ========================================================= -->
    <!-- LAYER 3: EMBEDDED HTTP & REST ROUTER LAYER -->
    <!-- ========================================================= -->
    <g class="layer-3" filter="url(#card-shadow)">
      <polygon points="0,150 -260,25 0,-100 260,25" fill="url(#layer-server)" stroke="#a855f7" stroke-width="2" />
      <polygon points="-260,25 0,150 0,165 -260,40" fill="rgba(168, 85, 247, 0.35)" stroke="#a855f7" stroke-width="1" />
      <polygon points="0,150 260,25 260,40 0,165" fill="rgba(59, 130, 246, 0.35)" stroke="#3b82f6" stroke-width="1" />

      <circle cx="-130" cy="20" r="6" fill="#a855f7" class="beacon" />
      <text x="-116" y="25" fill="#f5f3ff" font-size="12" font-weight="700">HttpServer (0.0.0.0:8096)</text>

      <circle cx="0" cy="-25" r="6" fill="#c084fc" class="beacon" />
      <text x="14" y="-20" fill="#f5f3ff" font-size="12" font-weight="700">REST APIs (/move, /state, /restart)</text>

      <circle cx="120" cy="20" r="6" fill="#60a5fa" class="beacon" />
      <text x="134" y="25" fill="#f5f3ff" font-size="12" font-weight="700">CORS &amp; Multi-IP LAN Bridge</text>

      <rect x="-210" y="80" width="165" height="24" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.8" />
      <text x="-127" y="96" fill="#c084fc" font-size="10.5" font-weight="800" text-anchor="middle">TIER 3: EMBEDDED REST SERVER</text>
    </g>

    <!-- DATA STREAM PIPES: LAYER 3 TO 4 -->
    <path d="M -130,-140 L -130,-220" class="data-pipe-1" />
    <path d="M 0,-185 L 0,-265" class="data-pipe-2" />
    <path d="M 120,-140 L 120,-220" class="data-pipe-1" />

    <!-- ========================================================= -->
    <!-- LAYER 4: UNIVERSAL CROSS-DEVICE WEB PRESENTATION LAYER -->
    <!-- ========================================================= -->
    <g class="layer-4" filter="url(#card-shadow)">
      <polygon points="0,150 -260,25 0,-100 260,25" fill="url(#layer-top)" stroke="#00f2fe" stroke-width="2.5" />
      <polygon points="-260,25 0,150 0,165 -260,40" fill="rgba(0, 242, 254, 0.4)" stroke="#00f2fe" stroke-width="1" />
      <polygon points="0,150 260,25 260,40 0,165" fill="rgba(255, 0, 127, 0.4)" stroke="#ff007f" stroke-width="1" />

      <!-- Mini 3x3 Grid on Top Plate -->
      <g transform="translate(-140, 5) scale(0.65)">
        <rect x="-30" y="-30" width="60" height="60" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#00f2fe" stroke-width="1.5" />
        <path d="M -10,-30 L -10,30 M 10,-30 L 10,30 M -30,-10 L 30,-10 M -30,10 L 30,10" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
        <text x="-20" y="-14" fill="#00f2fe" font-size="13" font-weight="900">✕</text>
        <text x="0" y="6" fill="#ff007f" font-size="13" font-weight="900">○</text>
        <text x="12" y="24" fill="#00f2fe" font-size="13" font-weight="900">✕</text>
      </g>
      <text x="-90" y="25" fill="#ecfeff" font-size="12" font-weight="800">Any Device (iOS, Android, PC)</text>

      <circle cx="0" cy="-25" r="6" fill="#ff007f" class="beacon" />
      <text x="14" y="-20" fill="#ecfeff" font-size="12" font-weight="800">Laser Win Stroke &amp; Confetti</text>

      <circle cx="120" cy="20" r="6" fill="#00f2fe" class="beacon" />
      <text x="134" y="25" fill="#ecfeff" font-size="12" font-weight="800">WebAudio 8-Bit Synthesizer</text>

      <rect x="-210" y="80" width="165" height="24" rx="12" fill="#0f172a" stroke="#00f2fe" stroke-width="1.8" />
      <text x="-127" y="96" fill="#00f2fe" font-size="10.5" font-weight="800" text-anchor="middle">TIER 4: UNIVERSAL WEB CLIENT</text>
    </g>

  </g>

  <!-- Bottom Legend & Specifications -->
  <g transform="translate(480, 675)">
    <rect x="-420" y="-18" width="840" height="36" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="-380" cy="0" r="5" fill="#00f2fe" />
    <text x="-368" y="4" fill="#94a3b8" font-size="11.5" font-weight="600">Universal Web Client</text>

    <circle cx="-180" cy="0" r="5" fill="#a855f7" />
    <text x="-168" y="4" fill="#94a3b8" font-size="11.5" font-weight="600">Zero-Dep REST Server</text>

    <circle cx="20" cy="0" r="5" fill="#0ea5e9" />
    <text x="32" y="4" fill="#94a3b8" font-size="11.5" font-weight="600">Matrix Core Engine</text>

    <circle cx="210" cy="0" r="5" fill="#f59e0b" />
    <text x="222" y="4" fill="#94a3b8" font-size="11.5" font-weight="600">JDK 21 Desktop GUI</text>
  </g>
</svg>
